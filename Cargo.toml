[package]
name = "culvert"
version = "0.2.0"
edition = "2024"
rust-version = "1.85"
description = "Typed access to the HDMI 2.1 SCDC register map"
readme = "README.md"
license = "MPL-2.0"
repository = "https://github.com/DracoWhitefire/culvert"
homepage = "https://ashlar-display.org"
keywords = ["ashlar", "hdmi", "no-std", "scdc", "frl"]
categories = ["hardware-support", "embedded", "no-std", "no-std::no-alloc"]

[package.metadata.docs.rs]
all-features = true

[features]
plumbob = ["dep:plumbob"]

[dependencies]
display-types = { version = "0.4", default-features = false }
hdmi-hal = { version = "0.5", default-features = false }
plumbob = { optional = true, version = "^0.3.0" }

[dev-dependencies]
hdmi-hal = { version = "0.5", default-features = false }

# Temporary, until display-types 0.4.3 (`HdmiForumFrl::lanes`) is published: replaces
# display-types for the whole graph, hdmi-hal's and plumbob's dependency included. Remove
# before merging.
[patch.crates-io]
display-types = { path = "../display-types" }
