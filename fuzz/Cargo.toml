[package]
name = "culvert-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
hdmi-hal = { version = "0.5", default-features = false }

[dependencies.culvert]
path = ".."

[[bin]]
name = "status_flags"
path = "fuzz_targets/status_flags.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ced"
path = "fuzz_targets/ced.rs"
test = false
doc = false
bench = false

# Temporary, until display-types 0.4.3 (`HdmiForumFrl::lanes`) and hdmi-hal with the
# required `read_block` are published: replaces them for the whole graph, hdmi-hal's and
# plumbob's dependencies included. Remove before merging.
[patch.crates-io]
hdmi-hal = { path = "../../hdmi-hal" }
display-types = { path = "../../display-types" }
